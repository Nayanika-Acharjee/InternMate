services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: internmate
      POSTGRES_PASSWORD: internmate
      POSTGRES_DB: internmate
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internmate"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://internmate:internmate@db:5432/internmate
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  # Keeps the job index fresh: re-fetches every 24h, re-embeds only changed listings, expires stale ones.
  ingester:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://internmate:internmate@db:5432/internmate
    command: ["python", "-m", "internmate.cli", "ingest", "--source", "sample", "remotive", "arbeitnow", "--every-hours", "24"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
