<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InternMate</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background: #f7f7f8; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  #log { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 60vh; overflow-y: auto; }
  .msg { margin: 8px 0; white-space: pre-wrap; }
  .you { color: #1a4fa0; }
  .card { border: 1px solid #e3e3e3; border-radius: 6px; padding: 8px 10px; margin: 6px 0 6px 12px; background: #fafafa; }
  .card small { color: #666; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  textarea { flex: 1; height: 60px; padding: 8px; }
  button { padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<h1>InternMate</h1>
<p>User ID: <input id="user" value="demo" size="12"> &middot; paste your resume or ask for internships.</p>
<div id="log"></div>
<form id="f">
  <textarea id="msg" placeholder="e.g. Find me remote Python + LLM internships"></textarea>
  <button>Send</button>
</form>
<script>
const log = document.getElementById("log");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

function add(text, cls) { const d = el("div", "msg " + cls, text); log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }

async function feedback(jobId, liked, btn) {
  await fetch("/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: document.getElementById("user").value, job_id: jobId, liked }) });
  btn.parentElement.querySelectorAll("button").forEach(b => b.disabled = true);
}

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const box = document.getElementById("msg");
  const message = box.value.trim();
  if (!message) return;
  box.value = "";
  add("you: " + message, "you");
  const pending = add("internmate is thinking...", "");
  const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: document.getElementById("user").value, message }) });
  const data = await res.json();
  pending.textContent = "internmate: " + (res.ok ? data.message : (data.detail || "error"));
  for (const c of (data.recommendations || [])) {
    const card = el("div", "card");
    const link = el("a", "", `${c.title} @ ${c.company}`); link.href = c.url; link.target = "_blank";
    card.append(link, el("small", "", `  ${c.location} · ${c.match_score}/100`), el("div", "", c.why_matched));
    if (c.missing_skills.length) card.append(el("small", "", "Missing: " + c.missing_skills.join(", ")));
    const up = el("button", "", "👍"), down = el("button", "", "👎");
    up.onclick = () => feedback(c.job_id, true, up); down.onclick = () => feedback(c.job_id, false, down);
    const row = el("div"); row.append(up, down); card.append(row);
    log.appendChild(card);
  }
  log.scrollTop = log.scrollHeight;
};
</script>
</body>
</html>
